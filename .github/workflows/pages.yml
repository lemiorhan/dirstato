name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/assets/logo.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The logo has one source, docs/assets/logo.svg, which the README uses too.
      - name: Add the logo to the site
        run: cp docs/assets/logo.svg site/logo.svg

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
